<main class="verse-page"><section class="verse-wrap"><p class="eyebrow">A MOMENT OF FAITH</p><h1>DAILY MOTIVATION.</h1><p class="verse-subtitle">A little encouragement for today.</p><article class="verse-panel" aria-live="polite"><p class="verse-date" id="verse-date"></p><blockquote class="verse-text" id="verse-text"></blockquote><p class="verse-reference" id="verse-reference"></p><p class="verse-translation">King James Version (KJV)</p></article><button type="button" class="verse-copy" id="verse-copy">Copy today's verse</button><p class="verse-footnote">A new verse appears each day based on your device's date.</p></section></main>

const verses=[["Psalm 118:24","This is the day which the LORD hath made; we will rejoice and be glad in it."],["Philippians 4:13","I can do all things through Christ which strengtheneth me."],["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."],["Psalm 46:1","God is our refuge and strength, a very present help in trouble."],["1 Thessalonians 5:16","Rejoice evermore."],["1 Thessalonians 5:17","Pray without ceasing."],["Psalm 119:105","Thy word is a lamp unto my feet, and a light unto my path."],["John 14:6","Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."],["Matthew 5:16","Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."],["Psalm 23:1","The LORD is my shepherd; I shall not want."],["Proverbs 16:3","Commit thy works unto the LORD, and thy thoughts shall be established."],["Isaiah 40:31","But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."],["Romans 12:12","Rejoicing in hope; patient in tribulation; continuing instant in prayer;"],["Psalm 56:3","What time I am afraid, I will trust in thee."],["Colossians 3:23","And whatsoever ye do, do it heartily, as to the Lord, and not unto men;"],["Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."],["James 1:5","If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."],["Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose."],["Psalm 37:4","Delight thyself also in the LORD; and he shall give thee the desires of thine heart."],["John 3:16","For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."],["Psalm 34:8","O taste and see that the LORD is good: blessed is the man that trusteth in him."]];
function showVerse(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),day=Math.floor(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate())/86400000),v=verses[((day%verses.length)+verses.length)%verses.length];document.getElementById('verse-date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('verse-text').textContent='“'+v[1]+'”';document.getElementById('verse-reference').textContent=v[0];return v}let current=showVerse();document.getElementById('verse-copy').addEventListener('click',async()=>{const content=current[1]+' — '+current[0]+' (KJV)';try{await navigator.clipboard.writeText(content);document.getElementById('verse-copy').textContent='Copied!';setTimeout(()=>document.getElementById('verse-copy').textContent="Copy today's verse",1800)}catch(e){window.prompt('Copy this verse:',content)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)current=showVerse()});const t=document.querySelector('.menu-toggle'),n=document.querySelector('#main-nav');t.addEventListener('click',()=>{const open=n.classList.toggle('open');t.setAttribute('aria-expanded',String(open));t.textContent=open?'×':'☰'});n.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{n.classList.remove('open');t.setAttribute('aria-expanded','false');t.textContent='☰'}));
</script></body></html>
